name: CI/CD Front-end

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t blog-frontend:${{ github.sha }} .
